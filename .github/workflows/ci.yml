name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.2", "24.20.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the complete quality and recorded-evidence gate
        run: pnpm check
      - name: Smoke-test the package archive
        run: pnpm package:smoke
